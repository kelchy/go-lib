name: go-publish-redis
on:
  pull_request:
    # Run after a pull request targeting this module's release branch is closed.
    branches:
      - redis/*
    types:
      - closed
    paths:
      - redis/go.mod
jobs:
  go-publish:
    name: go-publish-redis
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 2
    - name: Get version
      run: |
        VERSION=$(sed -n '1s|^//v||p' redis/go.mod)
        if [ -z "$VERSION" ]; then
          echo "Unable to read a version from redis/go.mod. Expected its first line to be //v<version>."
          exit 1
        fi
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '^1.18.1'
        cache: true
        cache-dependency-path: redis/go.sum

    - name: Test
      run: make test-redis

    - name: Create a GitHub release
      uses: actions/create-release@v1
      with:
        tag_name: redis/v${{ env.VERSION }}
        release_name: Release redis/v${{ env.VERSION }}
        body: |
          Release: redis/v${{ env.VERSION }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
